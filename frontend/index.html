<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Widow Blue</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a12;--cy:#4de1ff;--am:#ffb347;--tx:#cfeaf5;--dim:#5f8296}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:0}
.top{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none;z-index:2}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.06em;color:var(--cy);text-shadow:0 0 12px rgba(4,10,18,.8)}
.top p{margin:2px 0 0;font-size:13px;color:var(--dim);text-shadow:0 0 8px rgba(4,10,18,.7)}
.stat{position:fixed;right:56px;top:calc(12px + env(safe-area-inset-top,0px));text-align:right;font-size:13px;color:var(--dim);pointer-events:none;z-index:2;text-shadow:0 0 8px rgba(4,10,18,.7)}
.stat b{display:block;font-size:28px;color:var(--am);font-weight:700;line-height:1}
.bot{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(4,10,18,.5) 0%,rgba(4,10,18,.12) 50%,transparent 100%);pointer-events:none;z-index:2}
.bot .toggles,.bot .row,#chips{pointer-events:auto}
#log{
  height:min(52vh,480px);max-height:52vh;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  font-size:14px;line-height:1.4;display:flex;flex-direction:column;justify-content:flex-start;
  margin-bottom:8px;max-width:720px;width:100%;margin-left:auto;margin-right:auto;
  padding:8px 6px 8px 4px;background:transparent;border-radius:10px;
  scrollbar-width:thin;scrollbar-color:#4de1ff rgba(4,10,18,.45);
}
#log.empty{pointer-events:none;background:transparent;border:none}
#log.has-msgs{
  pointer-events:auto;touch-action:pan-y;
  background:rgba(4,10,18,.22);border:1px solid rgba(77,225,255,.12);
}
#log::-webkit-scrollbar{width:6px}
#log::-webkit-scrollbar-thumb{background:rgba(77,225,255,.45);border-radius:4px}
#log .msg{margin:4px 0;padding:8px 10px;border-radius:8px;max-width:95%;word-break:break-word}
#log .msg.user{align-self:flex-end;background:rgba(77,225,255,.15);border:1px solid rgba(77,225,255,.25)}
#log .msg.agent{align-self:flex-start;background:rgba(4,10,18,.35);border:1px solid rgba(95,130,150,.25)}
#log .msg.agent i{font-style:normal;color:var(--cy);font-weight:600}
#log .msg.reply{align-self:flex-start;background:rgba(4,10,18,.4);border:1px solid rgba(77,225,255,.2)}
#log .msg.reply .ans-h{font-weight:700;color:var(--cy);margin:6px 0 2px;font-size:13px}
#log .msg.reply .ans-src{margin:4px 0 0;padding-left:18px}
#log .msg.reply a{color:var(--am);text-decoration:underline}
#log .msg.reply .msg-actions{display:flex;gap:6px;margin-top:8px}
#log .msg.reply .msg-actions button{height:28px;padding:0 10px;font-size:12px;border-radius:4px;background:rgba(4,10,18,.4)}
#log .msg .atts{font-size:12px;color:var(--dim);margin-top:4px}
#log .gen-img{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid rgba(77,225,255,.2)}
.row{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto}
#q{flex:1;height:42px;background:rgba(4,10,18,.5);border:1px solid rgba(77,225,255,.35);border-radius:6px;color:var(--tx);font:600 15px Rajdhani,sans-serif;padding:10px 12px;backdrop-filter:blur(8px)}
select.lang{height:42px;background:rgba(4,10,18,.5);border:1px solid rgba(77,225,255,.4);border-radius:6px;color:var(--tx);font:600 12px Rajdhani,sans-serif;max-width:88px}
button{background:var(--cy);color:#04141c;border:0;border-radius:6px;font:700 15px Rajdhani,sans-serif;padding:0 14px;height:42px;cursor:pointer}
button.sec{background:rgba(4,10,18,.4);color:var(--cy);border:1px solid rgba(77,225,255,.4)}
button:disabled{opacity:.5}button.rec{border-color:#ff6b6b;color:#ff6b6b;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.6}}
.plus{width:42px;padding:0;font-size:22px}
#panel,#overlay{display:none!important}
.toggle{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid rgba(77,225,255,.35);background:rgba(4,10,18,.35);color:var(--dim);cursor:pointer;margin-bottom:4px;margin-right:6px}
.toggle.on{color:var(--am);border-color:var(--am)}
.toggles{display:flex;flex-wrap:wrap;gap:4px;max-width:720px;margin:0 auto 4px;pointer-events:auto}
#chips{max-width:720px;margin:0 auto 4px;min-height:0}
#chips .chip{display:inline-block;font-size:11px;padding:2px 8px;margin:2px;border-radius:4px;border:1px solid rgba(77,225,255,.3);color:var(--dim);cursor:pointer;background:rgba(4,10,18,.4)}

/* Glossario */
#glossOverlay{
  display:none;position:fixed;inset:0;background:rgba(2,6,12,.55);z-index:40;
  backdrop-filter:blur(2px);
}
#glossOverlay.open{display:block}
#glossPanel{
  display:none;position:fixed;z-index:41;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(520px,92vw);max-height:min(78vh,640px);
  background:rgba(6,14,24,.96);border:1px solid rgba(77,225,255,.35);
  border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);
  flex-direction:column;overflow:hidden;
}
#glossPanel.open{display:flex}
#glossPanel header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid rgba(77,225,255,.2);
}
#glossPanel header h3{margin:0;font-size:16px;color:var(--cy);letter-spacing:.04em}
#glossPanel header button{height:32px;padding:0 12px;font-size:13px}
#glossBody{
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px 16px;
  scrollbar-width:thin;scrollbar-color:#4de1ff rgba(4,10,18,.45);
}
.gloss-item{margin:0 0 12px;padding:10px 10px;border-radius:8px;background:rgba(4,10,18,.45);border:1px solid rgba(77,225,255,.12)}
.gloss-item h4{margin:0 0 4px;font-size:14px;color:var(--am);font-weight:700}
.gloss-item p{margin:0;font-size:13px;line-height:1.45;color:var(--tx)}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><h1>WIDOW BLUE</h1><p>Chat vuota: trascina la rete · con messaggi: scorri la chat (rete ai lati e in alto)</p></div>
<div class="stat"><b id="n">0</b>attivi su <span id="t">453</span> agenti</div>
<div class="bot">
<div id="log" class="empty"></div>
<div class="toggles">
<button type="button" class="toggle" id="newChat">Nuova chat</button>
<button type="button" class="toggle" id="allAgents">Tutti gli agenti: no</button>
<button type="button" class="toggle" id="shareThread">Condividi chat</button>
<button type="button" class="toggle" id="glossaryBtn">Glossario</button>
</div>
<div id="chips"></div>
<div class="row">
<button class="plus sec" id="clip" type="button" title="Carica file">+</button>
<input type="file" id="file" multiple hidden accept="*/*">
<select class="lang" id="lang" title="Lingua risposte / voce"></select>
<input id="q" type="text" placeholder="Scrivi nella tua lingua..." autocomplete="off">
<button class="sec" id="voice" type="button">Voce</button>
<button id="go" type="button">Invia</button>
</div></div>

<div id="glossOverlay" aria-hidden="true"></div>
<div id="glossPanel" aria-hidden="true" role="dialog" aria-label="Glossario AI">
  <header>
    <h3>Glossario AI</h3>
    <button type="button" class="sec" id="glossClose">Chiudi</button>
  </header>
  <div id="glossBody"></div>
</div>

<div id="overlay"></div>
<div id="panel"><h3 id="ptitle">Risultato</h3><div id="pbody"></div><div class="actions">
<button type="button" id="pcopy">Copia</button>
<button type="button" id="pdl" class="sec">Scarica</button>
<button type="button" id="pclose" class="sec">Chiudi</button>
</div></div>
<script src="wb-api.js"></script>
<script src="wb-auth.js"></script>
<script src="wb-canvas.js"></script>
<script src="wb-glossary.js"></script>
<script src="wb-app.js"></script>
</body></html>
