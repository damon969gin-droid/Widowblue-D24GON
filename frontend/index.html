<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Widow Blue</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a12;--cy:#4de1ff;--am:#ffb347;--tx:#cfeaf5;--dim:#5f8296}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:0}
.top{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none;z-index:2}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.06em;color:var(--cy);text-shadow:0 0 12px rgba(4,10,18,.8)}
.top p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.stat{position:fixed;right:56px;top:calc(12px + env(safe-area-inset-top,0px));text-align:right;font-size:13px;color:var(--dim);pointer-events:none;z-index:2}
.stat b{display:block;font-size:28px;color:var(--am);font-weight:700;line-height:1}
.bot{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(4,10,18,.5),transparent);pointer-events:none;z-index:2}
.bot .toggles,.bot .row,#chips,#log.has-msgs{pointer-events:auto}
#log{height:min(52vh,480px);overflow-y:auto;font-size:14px;line-height:1.4;display:flex;flex-direction:column;margin:0 auto 8px;max-width:720px;width:100%;padding:8px 6px;border-radius:10px}
#log.empty{pointer-events:none}
#log.has-msgs{background:rgba(4,10,18,.22);border:1px solid rgba(77,225,255,.12)}
#log .msg{margin:4px 0;padding:8px 10px;border-radius:8px;max-width:95%;word-break:break-word}
#log .msg.user{align-self:flex-end;background:rgba(77,225,255,.15);border:1px solid rgba(77,225,255,.25)}
#log .msg.reply{align-self:flex-start;background:rgba(4,10,18,.55);border:1px solid rgba(77,225,255,.18)}
#log .msg i{color:var(--am);font-style:normal;font-weight:600;margin-right:4px}
#log .reply-body{white-space:pre-wrap}
.toggles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;max-width:720px;margin-left:auto;margin-right:auto}
button.toggle{height:34px;padding:0 12px;border-radius:6px;border:1px solid rgba(77,225,255,.35);background:rgba(4,10,18,.45);color:var(--tx);font:600 12px Rajdhani,sans-serif;cursor:pointer}
button.toggle.on{border-color:var(--am);color:var(--am)}
.row{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto}
select.lang{height:42px;background:rgba(4,10,18,.5);border:1px solid rgba(77,225,255,.4);border-radius:6px;color:var(--tx);font:600 12px Rajdhani,sans-serif;max-width:88px}
#q{flex:1;height:42px;padding:0 12px;border-radius:6px;border:1px solid rgba(77,225,255,.4);background:rgba(4,10,18,.55);color:var(--tx);font:15px Rajdhani,sans-serif}
button{height:42px;padding:0 14px;border-radius:6px;border:1px solid rgba(77,225,255,.45);background:rgba(77,225,255,.15);color:var(--cy);font:700 14px Rajdhani,sans-serif;cursor:pointer}
button.sec{background:rgba(4,10,18,.45);color:var(--tx)}
button.plus{min-width:42px;padding:0;font-size:20px}
button:disabled{opacity:.5}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><h1>WIDOW BLUE</h1><p>Scrivi · genera immagini o video · trascina la rete</p></div>
<div class="stat"><b id="n">0</b>attivi su <span id="t">453</span> agenti</div>
<div class="bot">
<div id="log" class="empty"></div>
<div class="toggles">
<button type="button" class="toggle" id="newChat">Nuova chat</button>
<button type="button" class="toggle" id="allAgents">Tutti gli agenti: no</button>
<button type="button" class="toggle" id="shareThread">Condividi chat</button>
</div>
<div id="chips"></div>
<div class="row">
<button class="plus sec" id="clip" type="button">+</button>
<input type="file" id="file" multiple hidden>
<select class="lang" id="lang"></select>
<input id="q" type="text" placeholder="Scrivi… es. genera un video ciao" autocomplete="off">
<button class="sec" id="voice" type="button">Voce</button>
<button id="go" type="button">Invia</button>
</div></div>
<script src="wb-api.js?v=20261005vid2"></script>
<script src="wb-auth.js?v=20261005vid2"></script>
<script src="wb-canvas.js?v=20261005vid2"></script>
<script src="wb-app.js?v=20261005vid2"></script>
</body></html>
