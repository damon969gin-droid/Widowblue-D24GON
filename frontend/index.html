<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Widow Blue</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a12;--cy:#4de1ff;--am:#ffb347;--tx:#cfeaf5;--dim:#5f8296;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.top{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.06em;color:var(--cy)}
.top p{margin:2px 0 0;font-size:14px;color:var(--dim)}
.stat{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top,0px));text-align:right;font-size:14px;color:var(--dim);pointer-events:none}
.stat b{display:block;font-size:30px;color:var(--am);font-weight:700;line-height:1}
.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);pointer-events:none}
.bot>*{pointer-events:auto}
#log{height:92px;overflow:hidden;font-size:15px;line-height:1.35;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:8px;pointer-events:none}
#log div{color:var(--dim)}#log div:last-child{color:var(--tx)}
#log i{font-style:normal;color:var(--cy);font-weight:600}
.row{display:flex;gap:8px;max-width:720px;margin:0 auto}
input{flex:1;min-width:0;background:rgba(77,225,255,.07);border:1px solid rgba(77,225,255,.4);border-radius:6px;color:var(--tx);font:600 17px Rajdhani,sans-serif;padding:11px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--am);outline-offset:2px}
button{background:var(--cy);color:#04141c;border:0;border-radius:6px;font:700 17px Rajdhani,sans-serif;padding:0 18px;cursor:pointer}
button:disabled{opacity:.5}
#img{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(88vw,520px);display:none;background:rgba(4,10,18,.92);border:1px solid rgba(77,225,255,.4);border-radius:8px;padding:8px}#img img{display:block;max-width:100%;max-height:52vh;border-radius:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><h1>WIDOW BLUE</h1><p>Rete di agenti al lavoro. Trascina per ruotare.</p></div>
<div class="stat"><b id="n">0</b>attivi su 432 agenti</div>
<div class="bot">
<div id="log"><div><i>Widow Blue</i> pronta.</div><div>Tutti gli agenti: no</div></div>
<div class="row">
<button id="clip" type="button" title="Allega">+</button>
<input id="q" type="text" placeholder="Scrivi o parla..." autocomplete="off">
<button id="voice" type="button">Voce</button>
<button id="go" type="button">Invia</button>
</div>
</div>
<script>
const C=document.getElementById('c'),x=C.getContext('2d');
let W,H,cx,cy,R,t=0,drag=0,mx=0,my=0,rx=0.35,ry=0.15,RED=0;
const ROLES=['Coordinatore','Frontend','Backend','Design','Database','Media','Voce','Test','Memoria','Deploy','Sicurezza','Documenti'];
const nodes=[];
for(let i=0;i<12;i++){
  const a=i/12*6.283,k=i%3===0?0:1;
  nodes.push({r:ROLES[i],a,k,s:k?2.2:4.2,act:0,kids:[]});
}
nodes[0].kids=[1,2,3,4,5,7,8,9];
nodes[3].kids=[1];nodes[1].kids=[2];
const pulses=[];
function resize(){W=C.width=innerWidth;H=C.height=innerHeight;cx=W/2;cy=H*0.42;R=Math.min(W,H)*0.32}
resize();addEventListener('resize',resize);
C.addEventListener('pointerdown',e=>{drag=1;mx=e.clientX;my=e.clientY;C.setPointerCapture(e.pointerId)});
C.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-mx)*0.004;rx+=(e.clientY-my)*0.004;mx=e.clientX;my=e.clientY});
C.addEventListener('pointerup',()=>drag=0);
function proj(a,b,c){const s=Math.sin,c0=Math.cos;
  let x=a*c0(ry)-c*s(ry),z=a*s(ry)+c*c0(ry);
  let y=b*c0(rx)-z*s(rx);z=b*s(rx)+z*c0(rx);
  const sc=1/(1+z*0.0015);return [cx+x*sc,cy+y*sc,z,sc]}
function draw(){t+=0.008;x.clearRect(0,0,W,H);
  const P=nodes.map((n,i)=>{const a=n.a+t*0.15,rr=R*(0.55+n.k*0.35);
    return proj(Math.cos(a)*rr,Math.sin(a)*rr*0.55,Math.sin(a*2)*rr*0.12)});
  // lines
  x.globalAlpha=0.25;x.strokeStyle='#4de1ff';x.lineWidth=0.8;
  for(let i=0;i<12;i++)for(let j=i+1;j<12;j++){
    if(Math.random()>0.92)continue;
    x.beginPath();x.moveTo(P[i][0],P[i][1]);x.lineTo(P[j][0],P[j][1]);x.stroke();
  }
  // star edges
  x.globalAlpha=0.55;x.strokeStyle='rgba(232,251,255,.8)';x.lineWidth=1.3;
  const star=[0,3,6,9,1,4,7,10,2,5,8,11,0];
  x.beginPath();star.forEach((i,k)=>{const q=P[i];k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.stroke();
  // center glow
  const pu=1+Math.sin(t*2)*.1,gr=x.createRadialGradient(cx,cy,0,cx,cy,R*.14*pu);
  gr.addColorStop(0,'rgba(232,251,255,1)');gr.addColorStop(.4,'rgba(77,225,255,.7)');gr.addColorStop(1,'rgba(77,225,255,0)');
  x.fillStyle=gr;x.beginPath();x.arc(cx,cy,R*.14*pu,0,6.283);x.fill();
  // pulses
  for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.t+=.025;if(p.t>1){pulses.splice(i,1);continue}
    const a=p.from>=0?P[p.from]:[cx,cy],b=P[p.to];
    x.fillStyle='#ffb347';x.beginPath();x.arc(a[0]+(b[0]-a[0])*p.t,a[1]+(b[1]-a[1])*p.t,2.4,0,6.283);x.fill()}
  // nodes
  const ord=P.map((q,i)=>i).sort((a,b)=>P[b][2]-P[a][2]);let act=0;
  ord.forEach(i=>{const n=nodes[i],q=P[i];n.act*=.988;const g=n.act>.05;if(g)act++;
    const depth=Math.max(.25,Math.min(1,.65-q[2]*.5));
    x.globalAlpha=g?1:depth*(n.k?.75:1);x.fillStyle=g?'#ffb347':'#4de1ff';
    x.beginPath();x.arc(q[0],q[1],(n.s+(g?n.act*2.5:0))*q[3],0,6.283);x.fill();
    if(n.k===0&&W>500&&q[2]<.4){x.globalAlpha=depth;x.fillStyle=g?'#ffb347':'#8fb5c7';x.font='600 12px Rajdhani,sans-serif';x.textAlign='center';x.fillText(n.r,q[0],q[1]-11)}});
  x.globalAlpha=1;document.getElementById('n').textContent=act;requestAnimationFrame(draw)}
requestAnimationFrame(draw);
const log=document.getElementById('log');
function say(role,txt){const d=document.createElement('div');d.innerHTML='<i>'+role+'</i> '+txt;log.appendChild(d);while(log.children.length>4)log.removeChild(log.firstChild)}
function fire(i){const n=nodes[i];n.act=1;pulses.push({from:-1,to:i,t:0});
n.kids.forEach((k,j)=>setTimeout(()=>{nodes[k].act=1;pulses.push({from:i,to:k,t:0})},j*25))}
const steps=[[0,'Analizzo la richiesta','Coordinatore'],[3,'Palette e layout definiti','Design'],[1,'Genero i componenti Next.js e Tailwind','Frontend'],[2,'Creo API e autenticazione','Backend'],[4,'Configuro il database gratuito','Database'],[5,'Preparo immagini e splash','Media'],[7,'Eseguo i test','Test'],[8,'Salvo tutto in memoria','Memoria'],[9,'Pubblico','Deploy']];
let running=false;
function run(){if(running)return;const q=document.getElementById('q').value.trim();if(!q)return;
  running=true;document.getElementById('go').disabled=true;say('Coordinatore','sto elaborando...');
  fire(0);let i=0;const iv=setInterval(()=>{if(i<steps.length){const[s,m,r]=steps[i++];fire(s);say(r,m)}else{clearInterval(iv);running=false;document.getElementById('go').disabled=false;say('Widow Blue','completato')}},900);
  document.getElementById('q').value=''}
document.getElementById('go').onclick=run;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script>
</body></html>
