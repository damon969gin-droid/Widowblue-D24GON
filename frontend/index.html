<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Widow Blue</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a12;--cy:#4de1ff;--am:#ffb347;--tx:#cfeaf5;--dim:#5f8296}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.top{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none;z-index:2}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.06em;color:var(--cy)}
.top p{margin:2px 0 0;font-size:14px;color:var(--dim)}
.stat{position:fixed;right:56px;top:calc(12px + env(safe-area-inset-top,0px));text-align:right;font-size:14px;color:var(--dim);pointer-events:none;z-index:2}
.stat b{display:block;font-size:30px;color:var(--am);font-weight:700;line-height:1}
.bot{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);pointer-events:none;z-index:2}
.bot>*{pointer-events:auto}
#log{height:100px;overflow-y:auto;font-size:13px;line-height:1.35;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:6px;max-width:720px;margin-left:auto;margin-right:auto}
#log .msg{margin:2px 0;padding:4px 8px;border-radius:6px;max-width:95%}
#log .msg.user{background:rgba(77,225,255,.1);border:1px solid rgba(77,225,255,.25);align-self:flex-end}
#log .msg.agent{color:var(--dim)}#log .msg.agent i{font-style:normal;color:var(--cy);font-weight:600}
#log .atts{font-size:11px;color:var(--am);margin-top:2px}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;max-width:720px;margin-left:auto;margin-right:auto}
.chip{font-size:12px;padding:3px 8px;border-radius:4px;background:rgba(77,225,255,.12);border:1px solid rgba(77,225,255,.35);cursor:pointer}
.row{display:flex;gap:6px;max-width:720px;margin:0 auto;align-items:center}
input[type=text]{flex:1;min-width:0;background:rgba(77,225,255,.07);border:1px solid rgba(77,225,255,.4);border-radius:6px;color:var(--tx);font:600 15px Rajdhani,sans-serif;padding:10px 12px}
select.lang{height:42px;background:rgba(77,225,255,.07);border:1px solid rgba(77,225,255,.4);border-radius:6px;color:var(--tx);font:600 12px Rajdhani,sans-serif;max-width:88px}
button{background:var(--cy);color:#04141c;border:0;border-radius:6px;font:700 15px Rajdhani,sans-serif;padding:0 14px;height:42px;cursor:pointer}
button.sec{background:transparent;color:var(--cy);border:1px solid rgba(77,225,255,.4)}
button:disabled{opacity:.5}button.rec{border-color:#ff6b6b;color:#ff6b6b;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.6}}
.plus{width:42px;padding:0;font-size:22px}
#panel{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,560px);max-height:70vh;overflow:auto;background:rgba(4,10,18,.96);border:1px solid rgba(77,225,255,.4);border-radius:10px;padding:16px;z-index:20}
#panel h3{margin:0 0 10px;color:var(--cy)}#panel pre{white-space:pre-wrap;font-size:13px;line-height:1.4;margin:0;font-family:ui-monospace,monospace}
#panel .actions{display:flex;gap:8px;margin-top:12px}#panel .actions button{height:36px;font-size:14px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
.toggle{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid rgba(77,225,255,.35);background:transparent;color:var(--dim);cursor:pointer;margin-bottom:4px}
.toggle.on{color:var(--am);border-color:var(--am)}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><h1>WIDOW BLUE</h1><p>Rete di agenti al lavoro. Trascina per ruotare.</p></div>
<div class="stat"><b id="n">0</b>attivi su <span id="t">432</span> agenti</div>
<div class="bot">
<div id="log"><div class="msg agent"><i>Widow Blue</i> pronta. Menu ⋮ in alto a destra: cronologia, accesso, dashboard sicurezza.</div></div>
<button type="button" class="toggle" id="allAgents">Tutti gli agenti: no</button>
<div id="chips"></div>
<div class="row">
<button class="plus sec" id="clip" type="button">+</button>
<input type="file" id="file" multiple hidden accept="*/*">
<select class="lang" id="lang" title="Lingua voce"></select>
<input id="q" type="text" placeholder="Scrivi, parla o allega..." autocomplete="off">
<button class="sec" id="voice" type="button">Voce</button>
<button id="go" type="button">Invia</button>
</div></div>
<div id="overlay"></div>
<div id="panel"><h3 id="ptitle">Risultato</h3><pre id="pbody"></pre><div class="actions">
<button type="button" id="pcopy">Copia</button>
<button type="button" id="pdl" class="sec">Scarica</button>
<button type="button" id="pclose" class="sec">Chiudi</button>
</div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,cx,cy,R,t=0,yaw=.4,pit=.28,drag=false,lx=0,ly=0,running=false,allMode=false;
const ROLES=['Coordinatore','Frontend','Backend','Design','Database','Media','Voce','Test','Memoria','Deploy','Sicurezza','Documenti'];
const PH=(1+Math.sqrt(5))/2,IV=[];
[[0,1,PH],[0,1,-PH],[0,-1,PH],[0,-1,-PH],[1,PH,0],[1,-PH,0],[-1,PH,0],[-1,-PH,0],[PH,0,1],[PH,0,-1],[-PH,0,1],[-PH,0,-1]].forEach(v=>{const l=Math.hypot(...v);IV.push(v.map(a=>a/l))});
const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
const FACES=IV.map((v,i)=>{const nb=IV.map((u,j)=>j).filter(j=>j!==i&&Math.abs(d2(IV[j],v)-4/(1+PH*PH))<.01);const u0=Math.abs(v[0])<.9?[1,0,0]:[0,1,0];let a=[v[1]*u0[2]-v[2]*u0[1],v[2]*u0[0]-v[0]*u0[2],v[0]*u0[1]-v[1]*u0[0]];const al=Math.hypot(...a);a=a.map(q=>q/al);const b=[v[1]*a[2]-v[2]*a[1],v[2]*a[0]-v[0]*a[2],v[0]*a[1]-v[1]*a[0]];nb.sort((p,q)=>{const P=IV[p],Q=IV[q];return Math.atan2(P[0]*b[0]+P[1]*b[1]+P[2]*b[2],P[0]*a[0]+P[1]*a[1]+P[2]*a[2])-Math.atan2(Q[0]*b[0]+Q[1]*b[1]+Q[2]*b[2],Q[0]*a[0]+Q[1]*a[1]+Q[2]*a[2])});return[nb[0],nb[2],nb[4],nb[1],nb[3],nb[0]]});
function fib(i,n,r){const y=1-2*(i+.5)/n,q=Math.sqrt(Math.max(0,1-y*y)),a=i*2.39996;return[Math.cos(a)*q*r,y*r,Math.sin(a)*q*r]}
const nodes=[];ROLES.forEach((r,i)=>nodes.push({r,p:fib(i,12,.48),k:0,s:4.5,act:0,kids:[]}));
const shells=[[.22,.7],[.32,.9],[.46,1.12]],speed=[.04,-.03,.018];
shells.forEach(([share,rad],k)=>{const c=Math.round(400*share);for(let i=0;i<c;i++){const j=1+rad*.05*(Math.random()-.5),p=fib(i,c,rad*j);let best=0,bd=-9;nodes.slice(0,12).forEach((m,mi)=>{const d=m.p[0]*p[0]+m.p[1]*p[1]+m.p[2]*p[2];if(d>bd){bd=d;best=mi}});nodes.push({p,k:k+1,s:1.4+Math.random()*.9,act:0,par:best});nodes[best].kids.push(nodes.length-1)}});
document.getElementById('t').textContent=nodes.length;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;cx=W/2;cy=H*.42;R=Math.min(W,H)*.36}resize();addEventListener('resize',resize);
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*.005;pit+=(e.clientY-ly)*.004;lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',()=>drag=false);
function proj(p){let[x0,y0,z0]=p;let c=Math.cos(yaw),s=Math.sin(yaw);let x1=x0*c-z0*s,z1=x0*s+z0*c;c=Math.cos(pit);s=Math.sin(pit);let y1=y0*c-z1*s,z2=y0*s+z1*c;const sc=1/(1.15+z2*.5);return[cx+x1*R*sc,cy+y1*R*sc,z2,sc]}
const pulses=[];
function draw(){t+=.016;x.clearRect(0,0,W,H);shells.forEach((_,k)=>{const a=speed[k]*.016,c=Math.cos(a),s=Math.sin(a);nodes.forEach(n=>{if(n.k===k+1){const[px,py,pz]=n.p;n.p=[px*c-pz*s,py,px*s+pz*c]}})});if(!drag)yaw+=.003;const P=nodes.map(n=>proj(n.p));x.globalAlpha=.14;x.strokeStyle='#4de1ff';x.lineWidth=.7;for(let i=0;i<12;i++){x.beginPath();x.moveTo(cx,cy);x.lineTo(P[i][0],P[i][1]);x.stroke()}const c1=Math.cos(yaw),s1=Math.sin(yaw),c2=Math.cos(pit),s2=Math.sin(pit);const SV=IV.map(v=>{let p=v.map(a=>a*.42);p=[p[0]*c1+p[2]*s1,p[1],-p[0]*s1+p[2]*c1];p=[p[0],p[1]*c2-p[2]*s2,p[1]*s2+p[2]*c2];return proj(p)});FACES.map(f=>({f,z:f.slice(0,5).reduce((s,i)=>s+SV[i][2],0)})).sort((a,b)=>b.z-a.z).forEach(({f})=>{x.beginPath();f.forEach((i,k)=>k?x.lineTo(SV[i][0],SV[i][1]):x.moveTo(SV[i][0],SV[i][1]));x.closePath();x.fillStyle='rgba(77,225,255,.08)';x.fill();x.strokeStyle='rgba(232,251,255,.85)';x.lineWidth=1.25;x.stroke()});SV.forEach(q=>{x.fillStyle='#e8fbff';x.beginPath();x.arc(q[0],q[1],2.5*q[3],0,6.283);x.fill()});const pu=1+Math.sin(t*2)*.1,gr=x.createRadialGradient(cx,cy,0,cx,cy,R*.15*pu);gr.addColorStop(0,'rgba(232,251,255,1)');gr.addColorStop(.4,'rgba(77,225,255,.7)');gr.addColorStop(1,'rgba(77,225,255,0)');x.globalAlpha=1;x.fillStyle=gr;x.beginPath();x.arc(cx,cy,R*.15*pu,0,6.283);x.fill();for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.t+=.028;if(p.t>1){pulses.splice(i,1);continue}const a=p.from>=0?P[p.from]:[cx,cy],b=P[p.to];x.fillStyle='#ffb347';x.beginPath();x.arc(a[0]+(b[0]-a[0])*p.t,a[1]+(b[1]-a[1])*p.t,2.5,0,6.283);x.fill()}const ord=P.map((q,i)=>i).sort((a,b)=>P[b][2]-P[a][2]);let act=0;ord.forEach(i=>{const n=nodes[i],q=P[i];n.act*=.986;const g=n.act>.05;if(g)act++;const depth=Math.max(.22,Math.min(1,.68-q[2]*.45));x.globalAlpha=g?1:depth*(n.k?.72:1);x.fillStyle=g?'#ffb347':'#4de1ff';x.beginPath();x.arc(q[0],q[1],(n.s+(g?n.act*2.2:0))*q[3],0,6.283);x.fill();if(n.k===0&&W>500&&q[2]<.4){x.globalAlpha=depth;x.fillStyle=g?'#ffb347':'#8fb5c7';x.font='600 12px Rajdhani,sans-serif';x.textAlign='center';x.fillText(n.r,q[0],q[1]-11)}});x.globalAlpha=1;document.getElementById('n').textContent=act;requestAnimationFrame(draw)}requestAnimationFrame(draw);
const logEl=document.getElementById('log'),files=[];let lastResult='';
function say(role,txt,cls){const d=document.createElement('div');d.className='msg '+(cls||'agent');if(cls==='user')d.textContent=txt;else d.innerHTML='<i>'+role+'</i> '+txt;logEl.appendChild(d);logEl.scrollTop=1e9;while(logEl.children.length>40)logEl.removeChild(logEl.firstChild)}
function fire(i){if(i<0||i>=nodes.length)return;const n=nodes[i];n.act=1;pulses.push({from:-1,to:i,t:0});(n.kids||[]).forEach((k,j)=>setTimeout(()=>{if(nodes[k]){nodes[k].act=1;pulses.push({from:i,to:k,t:0})}},j*16))}
function fireAll(){for(let i=0;i<12;i++)setTimeout(()=>fire(i),i*80)}
function renderChips(){const c=document.getElementById('chips');c.innerHTML='';files.forEach((f,i)=>{const s=document.createElement('span');s.className='chip';s.textContent=f.name+' \u00d7';s.onclick=()=>{files.splice(i,1);renderChips()};c.appendChild(s)})}
document.getElementById('clip').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{for(const f of e.target.files){const item={name:f.name,type:f.type||'',size:f.size};if(f.type.startsWith('text/')||/\.(txt|md|json|csv|js|ts|tsx|jsx|py|html|css|yml|yaml|xml|svg)$/i.test(f.name)){try{item.text=(await f.text()).slice(0,80000)}catch(err){item.note='testo'}}else if(f.type.startsWith('image/'))item.note='immagine';else if(f.type.startsWith('video/'))item.note='video';else if(f.type.startsWith('audio/'))item.note='audio';else if(/\.(pdf|docx?|xlsx?|pptx?|zip|rar)$/i.test(f.name))item.note='documento';else item.note='allegato';files.push(item)}e.target.value='';renderChips();say('Media',files.length+' file in coda')};
const LANGS=[['auto','Auto'],['it-IT','IT'],['en-US','EN'],['en-GB','EN-GB'],['es-ES','ES'],['fr-FR','FR'],['de-DE','DE'],['pt-BR','PT'],['zh-CN','ZH'],['ja-JP','JA'],['ko-KR','KO'],['ar-SA','AR'],['ru-RU','RU'],['hi-IN','HI'],['nl-NL','NL'],['pl-PL','PL'],['tr-TR','TR'],['uk-UA','UK']];
const langSel=document.getElementById('lang');LANGS.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;langSel.appendChild(o)});
const bl=navigator.language||'it-IT';const m=LANGS.find(([v])=>v!=='auto'&&bl.toLowerCase().startsWith(v.slice(0,2).toLowerCase()));langSel.value=m?m[0]:'auto';
let rec=null,listening=false;const voiceBtn=document.getElementById('voice');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function currentLang(){const v=langSel.value;return v==='auto'?(navigator.language||'it-IT'):v}
if(SR){rec=new SR();rec.interimResults=true;rec.continuous=false;rec.onresult=e=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else document.getElementById('q').placeholder=t}if(final){const q=document.getElementById('q');q.value=(q.value+' '+final).trim();q.placeholder='Scrivi, parla o allega...'}};rec.onend=()=>{listening=false;voiceBtn.classList.remove('rec');voiceBtn.textContent='Voce'};rec.onerror=()=>{listening=false;voiceBtn.classList.remove('rec');voiceBtn.textContent='Voce';say('Voce','microfono non disponibile')}}
voiceBtn.onclick=()=>{if(!rec){say('Voce','Usa Chrome/Edge per la voce');return}if(listening){rec.stop();return}rec.lang=currentLang();listening=true;voiceBtn.classList.add('rec');voiceBtn.textContent='Ascolto\u2026';try{rec.start()}catch(e){listening=false;voiceBtn.classList.remove('rec');voiceBtn.textContent='Voce'}};
document.getElementById('allAgents').onclick=function(){allMode=!allMode;this.textContent='Tutti gli agenti: '+(allMode?'s\u00ec':'no');this.classList.toggle('on',allMode)};
function analyze(q,atts){const ql=q.toLowerCase();const links=q.match(/https?:\/\/[^\s]+/g)||[];const wants={web:/sito|web|landing|html|next|react|frontend|pagina|website/.test(ql),api:/api|backend|server|endpoint|fastapi|node/.test(ql),db:/database|db|postgres|sql|supabase|neon/.test(ql),mobile:/app|mobile|flutter|android|ios|swift|kotlin/.test(ql),auth:/login|auth|autenticazione|oauth|utente/.test(ql),media:/immagine|video|logo|splash|avatar|image/.test(ql),research:/cerca|ricerca|search|analizza|page/.test(ql)||links.length>0};const stack=[];if(wants.web)stack.push('Next.js + Tailwind');if(wants.api)stack.push('FastAPI / Node');if(wants.db)stack.push('PostgreSQL');if(wants.mobile)stack.push('Flutter');if(wants.auth)stack.push('Auth JWT');if(wants.research)stack.push('Ricerca multi-provider tracciata');if(!stack.length)stack.push('Next.js + Tailwind','Deploy Cloudflare');let attNote='';if(atts.length)attNote='\nAllegati in chat:\n'+atts.map(a=>'- '+a.name+(a.text?' ['+a.text.length+' car]':a.note?(' ['+a.note+']'):'')).join('\n');if(links.length)attNote+='\nLink:\n'+links.map(u=>'- '+u).join('\n');return{title:'Piano WidowBlue',body:'RICHIESTA (chat)\n'+q+attNote+'\n\nSTACK\n- '+stack.join('\n- ')+'\n\nPIANO\n1. Coordinatore\n2. Design HUD\n3. Frontend\n4. Backend\n5. Database\n6. Test\n7. Memoria\n8. Deploy\n\nRICERCA WEB\nAlta disponibilit\u00e0, multi-provider, tracciabile, rispettosa (robots.txt, rate limit, licenze).\n\n\u2014 WidowBlue \u00b7 open source'}};
const steps=[[0,'Analizzo','Coordinatore'],[3,'Design','Design'],[1,'Frontend','Frontend'],[2,'Backend','Backend'],[4,'Database','Database'],[5,'Media','Media'],[7,'Test','Test'],[8,'Memoria','Memoria'],[9,'Deploy','Deploy'],[10,'Sicurezza','Sicurezza'],[11,'Docs','Documenti']];
function showPanel(title,body){lastResult=body;document.getElementById('ptitle').textContent=title;document.getElementById('pbody').textContent=body;document.getElementById('panel').style.display='block';document.getElementById('overlay').style.display='block'}
document.getElementById('pclose').onclick=document.getElementById('overlay').onclick=()=>{document.getElementById('panel').style.display='none';document.getElementById('overlay').style.display='none'};
document.getElementById('pcopy').onclick=async()=>{try{await navigator.clipboard.writeText(lastResult);say('Widow Blue','copiato')}catch(e){}};
document.getElementById('pdl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lastResult],{type:'text/plain'}));a.download='widowblue-piano.txt';a.click()};
function run(){if(running)return;const q=document.getElementById('q').value.trim();if(!q&&!files.length){say('Widow Blue','scrivi, parla o allega');return}running=true;const go=document.getElementById('go');if(go)go.disabled=true;const prompt=q||'(solo allegati)';const atts=files.slice();const userDiv=document.createElement('div');userDiv.className='msg user';userDiv.textContent=prompt;if(atts.length){const ad=document.createElement('div');ad.className='atts';ad.textContent='Allegati: '+atts.map(a=>a.name).join(', ');userDiv.appendChild(ad)}logEl.appendChild(userDiv);logEl.scrollTop=1e9;say('Coordinatore','sto elaborando...');if(allMode)fireAll();else fire(0);let i=0;const iv=setInterval(()=>{if(i<steps.length){const[s,m,r]=steps[i++];fire(s);say(r,m)}else{clearInterval(iv);const res=analyze(prompt,atts);showPanel(res.title,res.body);if(window.wbSaveConversation)wbSaveConversation(prompt,res.body);say('Widow Blue','piano pronto');running=false;if(go)go.disabled=false;files.length=0;renderChips()}},650);document.getElementById('q').value=''}
document.getElementById('go').onclick=run;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script>
<script src="wb-auth.js"></script>
</body></html>
