name = "widowblue-d24gon"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./frontend"
binding = "ASSETS"

# Auth KV (obbligatorio per auth):
#   npx wrangler kv namespace create AUTH_KV
# [[kv_namespaces]]
# binding = "AUTH_KV"
# id = "YOUR_KV_ID"
# preview_id = "YOUR_PREVIEW_KV_ID"

# IMPORTANTE: le API key devono essere SECRET, non Variables.
# Le Variables vengono cancellate a ogni `wrangler deploy`.
# I Secret restano dopo il deploy.
#
#   npx wrangler secret put TAVILY_API_KEY
#   npx wrangler secret put SERPER_API_KEY
#   npx wrangler secret put PEPPER
#   npx wrangler secret put BRAVE_API_KEY
#
# Oppure Dashboard → Worker → Settings → Variables and Secrets
# → Add → tipo "Encrypt" / Secret (NON Plaintext Variable)
